name: Feature request
description: Suggest an idea or improvement for the pipeline
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What's the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      description: The stage of the pipeline most relevant to this request.
      options:
        - data preparation / IVS merge
        - PPCA fit
        - rotation and projection
        - LLM collection harness (cloud_survey / collect_cloud_2026)
        - response parsing (qn_classes) and refusal handling
        - bootstrap CIs (item / cluster)
        - region rules (SVM / nearest centroid) and headline statistics
        - QC, diagnostics and confirmatory analysis
        - figures
        - packaging / CI / docs
        - other / not sure
    validations:
      required: true
  - type: checkboxes
    id: numbers
    attributes:
      label: Impact on published results
      options:
        - label: This change could move a number reported in the paper
