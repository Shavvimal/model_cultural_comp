[project]
name = "model-cultural-comp"
version = "1.1.0"
description = "Mapping the cultural alignment of open-weight LLMs onto the Inglehart-Welzel cultural map, refitted from the Integrated Values Surveys"
readme = "README.md"
authors = [{ name = "Shav Vimalendiran", email = "shavhugan@gmail.com" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9.1",
    "pyreadstat>=1.2.7",
    "scikit-learn>=1.5.1",
    "factor-analyzer>=0.5.1",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "pydantic>=2.8.2",
    "ollama>=0.4.7",
    "scipy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/Shavvimal/model_cultural_comp"
Repository = "https://github.com/Shavvimal/model_cultural_comp"
Paper = "https://openreview.net/forum?id=xJHa9ts0mt"
Write-up = "https://shav.dev/blog/cultural-alignment-of-open-weight-llms-on-the-inglehart-welzel-map"
Changelog = "https://github.com/Shavvimal/model_cultural_comp/blob/main/CHANGELOG.md"
Issues = "https://github.com/Shavvimal/model_cultural_comp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fullwidth punctuation is correct in the Chinese survey prompts
"app/cloud_survey.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
