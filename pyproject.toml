[project]
name = "model-cultural-comp"
version = "0.1.0"
description = "Mapping the cultural alignment of LLMs onto the Inglehart-Welzel Cultural Map"
readme = "README.md"
authors = [{ name = "Shav Vimalendiran", email = "shavhugan@gmail.com" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9.1",
    "jupyter>=1.0.0",
    "pyreadstat>=1.2.7",
    "scikit-learn>=1.5.1",
    "factor-analyzer>=0.5.1",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "pydantic>=2.8.2",
    "ollama>=0.4.7",
    "huggingface-hub>=0.23.5",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "tqdm>=4.66.0",
    "seaborn>=0.13.2",
    "scipy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
